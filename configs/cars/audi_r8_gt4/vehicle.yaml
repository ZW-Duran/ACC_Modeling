vehicle_id: "audi_r8_gt4"
name: "Audi R8 LMS GT4"
class: "GT4"
drivetrain: "RWD"
layout: "Mid-Engine V10"

# 1. Immutable Rigid-Body & Geometry Constants
chassis:
  mass_kg: 1460.0 # Dry homologation mass without fuel
  front_weight_dist: 0.43
  wheelbase_m: 2.65 # Production-derived wheelbase (2650 mm)
  track_width_front_m: 1.64 # Overall width 1940 mm (narrower than GT3 Evo II)
  track_width_rear_m: 1.60
  cog_height_m: 0.47
  target_hot_pressure_psi: 27.0
  tire_sigma_p_psi: 1.5

# 2. Baseline Aerodynamics (Replaces deprecated aero_profile)
aero_baseline:
  reference_area_m2: 2.02
  base_cl: 0.32 # Low-downforce flat underbody baseline
  base_cd: 0.36
  base_aero_front_dist: 0.41

# 3. Black-Box Click-to-Physical Calibration Slots (Populated via telemetry identification)
calibration_slots:
  bumpstop_range_mm:               # Calibrated via SUSP_POS at BUMPSTOPUP > 0 threshold
    front_base_mm: null
    front_per_click_mm: null
    rear_base_mm: null
    rear_per_click_mm: null
  arb_stiffness_n_m:               # Calibrated via steady-state cornering roll differential
    front_base: null
    front_per_click: null
    rear_base: null
    rear_per_click: null
  dampers_n_s_m:                   # Calibrated via Virtual Damper Dyno (straight braking + curbs)
    knee_velocity_mps: 0.05
    bump_slow_base: null
    bump_slow_per_click: null
    bump_fast_base: null
    bump_fast_per_click: null
    rebound_slow_base: null
    rebound_slow_per_click: null
    rebound_fast_base: null
    rebound_fast_per_click: null
  aero_clicks:                     # Calibrated via straight-line Vmax / coastdown & high-speed Fz
    rear_wing_dcl_per_click: null
    rear_wing_dcd_per_click: null
    front_splitter_dcl_per_click: null
    front_splitter_df_dist_per_click: null
    front_brake_duct_dcd_per_click: null # Front cooling duct drag delta-Cd per click (click=0 -> base)
    rear_brake_duct_dcd_per_click: null  # Rear cooling duct drag delta-Cd per click (click=0 -> base)
